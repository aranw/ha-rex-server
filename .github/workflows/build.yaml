name: Build and publish app image

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      base_image:
        description: "Base image to build FROM (build arg BUILD_FROM). Must be a multi-arch manifest covering linux/amd64 and linux/arm64, Alpine-based with s6-overlay v3 and bashio"
        required: false
        default: "ghcr.io/home-assistant/base:3.24"

permissions:
  contents: read
  packages: write

# Empty on push events, so the default applies there too.
env:
  BASE_IMAGE: ${{ inputs.base_image || 'ghcr.io/home-assistant/base:3.24' }}

jobs:
  version:
    name: Read app version from config.yaml
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        # The Supervisor pulls `<image>:<version>`, so the image tag must
        # equal the app version in rex_server/config.yaml.
        run: |
          version=$(sed -n 's/^version: *"\([^"]*\)".*/\1/p' rex_server/config.yaml)
          echo "version=${version}" >> "$GITHUB_OUTPUT"

  build:
    name: Build and push multi-arch image
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Builds rex_server/ for linux/amd64 and linux/arm64 and pushes them as
      # one multi-arch manifest: ghcr.io/aranw/ha-rex-server:<version>.
      # config.yaml's `image` points at that name (no {arch} placeholder);
      # the Supervisor resolves the host architecture from the manifest list.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: rex_server
          build-args: |
            BUILD_FROM=${{ env.BASE_IMAGE }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/aranw/ha-rex-server:${{ needs.version.outputs.version }}
            ghcr.io/aranw/ha-rex-server:latest

      # The Supervisor pulls app images anonymously, so the ghcr package
      # must be public (packages are private by default). The workflow
      # GITHUB_TOKEN gets a 404 on the visibility API for user-owned
      # packages, so this only warns: flip it once in the UI, at
      # repo > Packages > ha-rex-server > Package settings > Public.
      - name: Make the ghcr package public
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if curl -fsS -X PATCH \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/user/packages/container/ha-rex-server/visibility" \
              -d '{"visibility":"public"}'; then
            echo "ghcr package visibility set to public"
          else
            echo "::warning::could not set ghcr package visibility via API (404 with GITHUB_TOKEN); set it to public once in the GitHub UI (repo > Packages > ha-rex-server > Package settings) - the Supervisor pulls images anonymously"
          fi
